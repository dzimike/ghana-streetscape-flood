project:
  name: accra-pilot
  study_area: Accra Metropolitan Area
  crs: EPSG:32630          # UTM Zone 30N — covers Ghana
  output_crs: EPSG:4326

study_boundary:
  # Bounding box for Greater Accra Region
  bbox: [-0.3500, 5.4900, 0.1500, 5.7500]   # [west, south, east, north]
  admin_level: 6                              # OSM admin_level for districts

sampling:
  segment_length_m: 100
  headings: [0, 90, 180, 270]
  pitch: 0
  fov: 90
  image_size: "640x640"
  target_points: 5000
  target_images: 20000
  min_streetview_date: "2018-01-01"
  stratify_by:
    - flood_risk_class
    - road_type
    - settlement_type

road_classes:
  include:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - residential
    - unclassified
    - living_street
    - service
  exclude:
    - footway
    - cycleway
    - path
    - steps

flood_risk:
  depression_threshold_m: 2.0        # depth below 1% flow accumulation surface
  proximity_drain_m: 100
  proximity_waterway_m: 100
  proximity_wetland_m: 200
  twi_high_threshold: 8.0

streetview:
  metadata_url: "https://maps.googleapis.com/maps/api/streetview/metadata"
  static_url: "https://maps.googleapis.com/maps/api/streetview"
  requests_per_second: 10
  retry_attempts: 3
  retry_backoff_s: 2

slfvi:
  weights:
    hazard: 0.30
    exposure: 0.20
    sensitivity: 0.35
    adaptive_capacity: 0.15
  thresholds:
    very_low: 0.20
    low: 0.40
    moderate: 0.60
    high: 0.80

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  data_validation: data/validation
  models: models
  outputs: outputs

osm:
  overpass_url: "https://overpass-api.de/api/interpreter"
  network_type: drive
